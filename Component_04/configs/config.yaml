# =====================================================================
# Component 04 — Temporally-Safe Explainable ACS Triage
# Single source of truth for every stage of the pipeline.
# =====================================================================

paths:
  # Raw MIMIC-IV-ED derived parquet files (extracted via BigQuery).
  # Held inside the component. It previously lived in a sibling copy of an
  # earlier version of this project, which meant the component could not be
  # moved or handed over without silently losing the data it preprocesses from.
  raw_dir: "data/processed"
  # Everything this component produces.
  artifacts_dir: "artifacts"

seed: 42

# ---------------------------------------------------------------------
# Temporal anchoring.  T0 = ED arrival (edstays.intime).
# Progressive Horizon Modelling: the same cohort is featurised at
# several disclosure horizons so we can plot accuracy-vs-time.
# ---------------------------------------------------------------------
temporal:
  horizons_h: [0, 6, 24]        # feature windows [T0, T0+h]
  primary_horizon_h: 24         # horizon used for the headline model
  ecg_lookback_h: 1.0           # ECG may precede T0 by this much (EMS/triage ECG)
  max_ed_los_h: 168             # sanity cap on ED length of stay

# ---------------------------------------------------------------------
# Intended Use Population (IUP) — the "suspected ACS" evaluation cohort.
# An ACS triage aid is not applied to ankle fractures; it is applied to
# patients in whom a cardiac cause is being considered.  Both criteria
# are observable AT triage (a chief complaint, and the act of ordering
# an ECG), so this is a selection rule, not a feature leak.
# ---------------------------------------------------------------------
cohort:
  enable: true
  ecg_within_h: 3.0             # ECG acquired within 3h of arrival
  require_triage_vitals: false  # MUST stay false: 19% of STEMI patients arrive
                                # in arrest and have NO triage vitals recorded.
                                # Requiring vitals silently excludes the sickest
                                # patients and biases the cohort.
  # Retains ~99% UA / 96% NSTEMI / 97% STEMI while removing 44% of No-ACS.

# ---------------------------------------------------------------------
# Patient-level grouped, stratified split.  No subject_id may appear in
# more than one fold.
# ---------------------------------------------------------------------
split:
  train: 0.70
  val: 0.15
  test: 0.15
  group_col: "subject_id"
  stratify_col: "acs_label"

# ---------------------------------------------------------------------
# Text pipeline
# ---------------------------------------------------------------------
text:
  rdm_enable: true              # Referral-Diagnosis Masking (default ON)
  svd_components: 24
  tfidf_word_max_features: 6000
  tfidf_char_max_features: 6000
  min_df: 3

# ---------------------------------------------------------------------
# Models
# ---------------------------------------------------------------------
model:
  device: "cuda"                # falls back to cpu automatically
  # --- GPU saturation -------------------------------------------------
  # A single fit on 4k x 221 floats leaves an RTX 4060 idle between kernel
  # launches.  Concurrency is what fills it; VRAM follows from concurrency
  # and histogram width, not from the (tiny) dataset.
  n_parallel_trials: 8          # concurrent Optuna trials -> 8 CUDA streams
  max_bin: 4096                 # histogram bins (default 256).  16x the
                                # default: much larger GPU histograms, finer
                                # split points.  Backs off automatically on OOM.
  gpu_oom_backoff: true         # halve max_bin and retry instead of dying
  progress: true                # live self-refreshing progress + VRAM readout
  stage1:
    n_trials: 40
    n_estimators: 3000
    early_stopping_rounds: 100
  stage2:
    n_trials: 60
    n_estimators: 2000
    early_stopping_rounds: 80
    cv_folds: 5

# ---------------------------------------------------------------------
# Constrained Decision Layer.
# Class-prior vector is searched on VALIDATION under a hard per-class
# recall floor, then FROZEN before it ever sees the test set.
# ---------------------------------------------------------------------
decision:
  min_recall_floor: 0.75        # the "every class >= 75" requirement
  # Constraint tightening.  Searching at floor + margin is the textbook fix for
  # a constraint that holds on validation and slips on test.  Here it does not
  # help: `recalibrate.py --sweep` shows test STEMI recall pinned at 101/137
  # for every margin in [0, 0.10] while macro-F1 decays monotonically, because
  # the shortfall is a 2-case sampling gap on 137 STEMIs, not a mis-set
  # threshold.  Kept at 0, which our own selection rule (max macro-F1 subject
  # to val min-recall >= floor) independently selects.  The sweep is retained
  # in artifacts/reports/margin_sweep_H24.json as evidence.
  floor_margin: 0.0
  floor_relaxation: [0.75, 0.74, 0.73, 0.72, 0.70]
  objective: "macro_f1"         # maximised subject to the floor
  stage1_target_sensitivity: 0.80

evaluation:
  bootstrap_n: 1000
  bootstrap_alpha: 0.05
